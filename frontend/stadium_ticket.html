<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCB v CSK | TicketEase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--bg:#E4E4DF;--paper:#F7F7F3;--ink:#12171A;--mute:#5B6360;--rule:#C6C8C1;--sig:#C21F2D;--night:#0A1215;
--dsp:'Barlow Condensed','Arial Narrow',sans-serif;--ui:'Hanken Grotesk',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1416;--paper:#162024;--ink:#E9ECE6;--mute:#8F9994;--rule:#2A3438;--sig:#D63341}}
:root[data-theme="dark"]{--bg:#0E1416;--paper:#162024;--ink:#E9ECE6;--mute:#8F9994;--rule:#2A3438;--sig:#D63341}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.mast{background:var(--night);color:#F2F3EE;padding:18px clamp(16px,4vw,48px) clamp(24px,3.5vw,40px)}
.logo{display:block;font:700 22px var(--dsp);letter-spacing:.03em;margin-bottom:clamp(20px,3.5vw,40px)}
h1{font:700 clamp(60px,10vw,118px)/.86 var(--dsp);margin:0 0 18px;letter-spacing:-.01em}
.mast p{margin:0;font-weight:500;line-height:1.6;color:#DCE0DA}.mast p+p{color:#9FA9A5;font-weight:400}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:clamp(24px,4vw,56px);max-width:1360px;margin:0 auto;padding:clamp(24px,4vw,48px) clamp(16px,4vw,48px) 64px;align-items:start}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.ph{border-bottom:1px solid var(--ink);padding-bottom:12px}
h2{font:600 42px/1 var(--dsp);margin:0}
.msg{min-height:24px;margin:8px 0 0;font-size:14px;color:var(--sig)}
.vp{position:relative;aspect-ratio:16/10;min-height:420px;background:#070d10;overflow:hidden;touch-action:none;color:#EEF2EE}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.vp canvas:active{cursor:grabbing}
#hud{position:absolute;left:12px;top:12px;max-width:min(360px,70%);padding:10px 14px;background:rgba(7,13,16,.86);font-size:14px;line-height:1.45;pointer-events:none}
#hud b{font:600 22px/1.1 var(--dsp);letter-spacing:.02em}
#tip{position:absolute;padding:8px 12px;background:#0A1215;border:1px solid #2A3438;font-size:13px;line-height:1.4;pointer-events:none;white-space:nowrap}
#bar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
#bar button{padding:10px 14px;background:rgba(7,13,16,.9);border:1px solid #2A3438;font-size:14px;font-weight:500;color:#EEF2EE}
#bar button:hover{border-color:#8F9994}
#bar .sp{flex:1}
#bar .add{background:#EEF2EE;color:#0A1215;border-color:#EEF2EE;font-weight:600}
.key{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:14px}
.key button,.lg{display:flex;align-items:center;gap:8px;padding:4px 0}
.key i{width:14px;height:14px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.key button[aria-pressed=true]{font-weight:600;box-shadow:0 2px 0 var(--ink)}
.kl{color:var(--mute)}
.ticket{position:sticky;top:16px;overflow:hidden;background:var(--paper);border:1px solid var(--rule);box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 30px -14px rgba(0,0,0,.35)}
@media(max-width:1000px){.ticket{position:static}}
.th{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 20px;background:var(--night);color:#F2F3EE}
.th b{font:700 34px/.9 var(--dsp)}.th span{font-size:13px;line-height:1.4;text-align:right;color:#9FA9A5}
.tb{padding:20px}
.tb h3{font:600 28px/1 var(--dsp);margin:0 0 14px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--rule);font-weight:500}
.ln small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.rt{text-align:right;font-variant-numeric:tabular-nums}
.rm{font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.perf{position:relative;margin:16px -20px;border-top:2px dashed var(--rule)}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--rule)}
.perf::before{left:-11px}.perf::after{right:-11px}
.fl{display:flex;justify-content:space-between;padding:3px 0;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:12px;border-top:1px solid var(--ink)}
.tot b{font:700 46px/1 var(--dsp);font-variant-numeric:tabular-nums}
.pay{display:block;width:100%;margin-top:16px;padding:14px;border-radius:2px;background:var(--sig);color:#fff;font:600 22px/1 var(--dsp);letter-spacing:.04em}
.pay.ghost{background:none;border:1px solid var(--ink);color:var(--ink)}
.note{margin:12px 0 0;font-size:13px;line-height:1.5;color:var(--mute)}
.bc{display:block;width:100%;height:44px;margin:16px 0 0;fill:var(--ink)}
.ft{background:var(--night);color:#8F9994;padding:20px clamp(16px,4vw,48px);font-size:13px}
</style></head>
<body>
<header class="mast"><span class="logo">TicketEase</span><h1>RCB v CSK</h1><p>Saturday 7 November 2026, 7:30 pm</p><p>M. Chinnaswamy Stadium, Bengaluru</p></header>
<main class="wrap">
<section aria-labelledby="h">
<div class="ph"><h2 id="h">Choose your seats</h2></div>
<p class="msg" id="msg" role="status"></p>
<div class="vp" id="vp"><div id="hud"></div><div id="tip" hidden></div><div id="bar"></div></div>
<div class="key" id="key"></div>
</section>
<aside class="ticket" aria-label="Your seats and price">
<div class="th"><b>RCB v CSK</b><span>Sat 7 Nov 2026, 7:30 pm<br>M. Chinnaswamy Stadium</span></div>
<div class="tb" id="body"></div>
</aside>
</main>
<footer class="ft">TicketEase. Seat availability and prices on this page are demonstration data.</footer>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s),R=n=>'₹'+n.toLocaleString('en-IN'),host=$('#vp');
if(!window.THREE||!document.createElement('canvas').getContext('webgl')){host.insertAdjacentHTML('beforeend','<p style="padding:24px">The 3D stadium needs WebGL, which this browser has turned off or does not support.</p>');return}
const T=THREE,NM=['North','East','South','West'],ROWS=10,MAXS=6,TIER=[[1.18,1.5],[1.58,1.96]];
const TC={4500:0x86e8ab,2500:0x5bc788,1800:0x3a9c69,1200:0x2f7d5a},hx=n=>'#'+n.toString(16).padStart(6,'0');
const rnd=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* data: 24 blocks (4 stands x 3 blocks x 2 tiers), 10 rows each. Price follows position: square of the wicket costs most */
const blocks=[];
for(let t=0;t<2;t++)for(let i=0;i<12;i++){
  const st=i/3|0,n=i%3,a0=st*90-45+n*30,mid=st%2==1&&n==1,g=rnd(t*40+i+11);
  const price=t?(mid?1800:1200):(mid?4500:2500),code=NM[st]+' '+(t?'U':'L')+(n+1),dem=code=='South U2'?2:mid?.72:.3+g()*.35;
  blocks.push({i:blocks.length,code,t,a0,a1:a0+30,price,seats:[...Array(ROWS)].map((_,r)=>[...Array(12+r)].map(()=>{const v=g();return v<dem?1:v<dem+.03?2:0}))});
}
const ro=[0];for(let r=0;r<ROWS;r++)ro.push(ro[r]+12+r);
blocks.forEach(b=>b.base=b.i*ro[ROWS]);
const idx=(b,r,k)=>b.base+ro[r]+k,S=[];
blocks.forEach(b=>{for(let r=0;r<ROWS;r++)for(let k=0;k<12+r;k++)S.push({b,r,k})});
const ty=(t,r)=>t?14+r*1.1:2+r*.9;
const pos=(b,r,k)=>{const n=12+r,a=(b.a1-(b.a1-b.a0)*(k+.5)/n)*Math.PI/180,[s0,s1]=TIER[b.t],s=s0+(s1-s0)*(r+.5)/ROWS;return{x:75*s*Math.sin(a),y:ty(b.t,r),z:-65*s*Math.cos(a)}};
let sel=[],selSet=new Set(),done=null,hold=0,timer=0,tier=null,hov=-1,mode='orbit',se=null,tw=null,dirty=1,hq=0,hp=null;

/* scene */
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));host.prepend(ren.domElement);
const el=ren.domElement;el.tabIndex=0;el.setAttribute('aria-label','3D stadium. Arrow keys rotate, plus and minus zoom.');
const scene=new T.Scene();scene.background=new T.Color(0x070d10);scene.fog=new T.Fog(0x070d10,320,800);
const cam=new T.PerspectiveCamera(45,1,.3,1500);
scene.add(new T.HemisphereLight(0xcfdde6,0x10181a,1));
const dl=new T.DirectionalLight(0xfff1d8,.7);dl.position.set(120,200,80);scene.add(dl);
const gr=new T.Mesh(new T.CircleGeometry(900,48),new T.MeshStandardMaterial({color:0x0b1114,roughness:1}));gr.rotation.x=-Math.PI/2;gr.position.y=-.05;scene.add(gr);

const cv=document.createElement('canvas');cv.width=cv.height=1024;const c=cv.getContext('2d');
for(let i=0;i<16;i++){c.fillStyle=i%2?'#2f7a53':'#2a6c49';c.fillRect(i*64,0,64,1024)}
c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=3;c.beginPath();c.ellipse(512,512,184,213,0,0,7);c.stroke();
c.fillStyle='#cdbf94';c.fillRect(502,433,21,158);c.fillStyle='#fff';[441,583].forEach(y=>c.fillRect(490,y,45,2));
const tx=new T.CanvasTexture(cv);
const pm=new T.Mesh(new T.CircleGeometry(1,96),new T.MeshStandardMaterial({map:tx,emissive:0xffffff,emissiveMap:tx,emissiveIntensity:.3,roughness:1}));
pm.scale.set(75,65,1);pm.rotation.x=-Math.PI/2;scene.add(pm);
const rp=[];for(let i=0;i<128;i++){const a=i/128*6.2832;rp.push(new T.Vector3(75*Math.sin(a),.08,-65*Math.cos(a)))}
scene.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(rp),new T.LineBasicMaterial({color:0xffffff})));
const hm=[0xc21f2d,0xe9ecef].map(x=>new T.MeshStandardMaterial({color:x,roughness:.6}));
for(let i=0;i<48;i++){const a=(i+.5)/48*6.2832,m=new T.Mesh(new T.BoxGeometry(10.5,1.1,.3),hm[i%2]);m.position.set(78*Math.sin(a),.55,-67.6*Math.cos(a));m.rotation.y=-Math.atan2(67.6*Math.sin(a),78*Math.cos(a));scene.add(m)}
[-1,1].forEach(d=>{const m=new T.Mesh(new T.BoxGeometry(14,7,.5),new T.MeshStandardMaterial({color:0xf2f2ee}));m.position.set(0,3.5,d*69.5);scene.add(m)});

/* bowl: one swept profile (lower tier, walkway, upper tier, rim) around the ellipse */
function ring(prof,col,N=120){
  const p=[],ix=[];prof.forEach(([s,y])=>{for(let i=0;i<=N;i++){const a=i/N*6.2832;p.push(75*s*Math.sin(a),y,-65*s*Math.cos(a))}});
  for(let j=0;j<prof.length-1;j++)for(let i=0;i<N;i++){const a=j*(N+1)+i,b=a+1,d=a+N+1;ix.push(a,d,b,b,d,d+1)}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(p,3));g.setIndex(ix);
  return new T.Mesh(g,new T.MeshStandardMaterial({color:col,roughness:.95,side:T.DoubleSide,flatShading:true}));
}
const rows=t=>{const[s0,s1]=TIER[t],p=[];for(let r=0;r<ROWS;r++){const y=ty(t,r);p.push([s0+(s1-s0)*r/ROWS,y],[s0+(s1-s0)*(r+1)/ROWS,y])}return p};
const TER=ring([[1.18,0],...rows(0),[1.5,14],...rows(1),[1.96,28],[2.1,28],[2.1,0]],0x2b343a);scene.add(TER);

/* floodlights */
const gc=document.createElement('canvas');gc.width=gc.height=64;const g2=gc.getContext('2d'),gg=g2.createRadialGradient(32,32,0,32,32,32);
gg.addColorStop(0,'rgba(255,248,224,1)');gg.addColorStop(.25,'rgba(255,244,214,.45)');gg.addColorStop(1,'rgba(255,244,214,0)');g2.fillStyle=gg;g2.fillRect(0,0,64,64);
const gt=new T.CanvasTexture(gc);
[45,135,225,315].forEach(d=>{const a=d*Math.PI/180,x=172*Math.sin(a),z=-150*Math.cos(a);
  const m=new T.Mesh(new T.CylinderGeometry(.7,1.1,56,8),new T.MeshStandardMaterial({color:0x39444a}));m.position.set(x,28,z);scene.add(m);
  const h=new T.Mesh(new T.BoxGeometry(14,7,1.2),new T.MeshBasicMaterial({color:0xfff4d6}));h.position.set(x,58,z);h.lookAt(0,20,0);scene.add(h);
  const s=new T.Sprite(new T.SpriteMaterial({map:gt,fog:false,depthWrite:false,blending:T.AdditiveBlending}));s.scale.set(90,90,1);s.position.set(x,58,z);scene.add(s)});

/* seats: one instanced cushion and one instanced back rest per seat, all facing the pitch */
const N=S.length,sm=new T.MeshStandardMaterial({roughness:.7}),IC=new T.InstancedMesh(new T.BoxGeometry(1.5,.35,1.4),sm,N),IB=new T.InstancedMesh(new T.BoxGeometry(1.5,1.1,.25),sm,N);
const M=new T.Matrix4(),Q=new T.Quaternion(),V=new T.Vector3(),UP=new T.Vector3(0,1,0),ONE=new T.Vector3(1,1,1),col=new T.Color(),WH=new T.Color(0xffffff);
function paint(i){
  const s=S[i],st=s.b.seats[s.r][s.k],on=selSet.has(i);
  col.set(on?0xff3b4a:st==1?0x39434a:st==2?0xd19a2a:TC[s.b.price]);
  if(!on&&!st&&tier&&s.b.price!=tier)col.multiplyScalar(.2);
  if(i===hov&&!st&&!on)col.copy(WH);
  IC.setColorAt(i,col);IB.setColorAt(i,col);IC.instanceColor.needsUpdate=IB.instanceColor.needsUpdate=true;dirty=1;
}
S.forEach((s,i)=>{
  const p=pos(s.b,s.r,s.k),yaw=Math.atan2(-p.x,-p.z);s.p=p;s.yaw=yaw;Q.setFromAxisAngle(UP,yaw);
  M.compose(V.set(p.x,p.y+.2,p.z),Q,ONE);IC.setMatrixAt(i,M);
  M.compose(V.set(p.x-Math.sin(yaw)*.62,p.y+.85,p.z-Math.cos(yaw)*.62),Q,ONE);IB.setMatrixAt(i,M);paint(i);
});
scene.add(IC,IB);
const repaint=old=>{selSet=new Set(sel.map(x=>x.i));new Set([...old,...selSet]).forEach(paint)};

/* camera: orbit around the pitch, or sit in a seat. Both are a position plus a look-at point, so one tween covers every move */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),TG=new T.Vector3(0,6,0),cur={p:new T.Vector3(),l:new T.Vector3(),f:45};
let ob={th:3.93,el:.62,R:300};
function pose(){
  if(mode=='orbit'){const c=Math.cos(ob.el);return{p:new T.Vector3(TG.x+ob.R*Math.sin(ob.th)*c,TG.y+ob.R*Math.sin(ob.el),TG.z-ob.R*Math.cos(ob.th)*c),l:TG.clone(),f:45}}
  const c=Math.cos(se.pi);return{p:se.e.clone(),l:se.e.clone().add(new T.Vector3(Math.sin(se.yaw)*c,Math.sin(se.pi),Math.cos(se.yaw)*c).multiplyScalar(20)),f:se.f};
}
function apply(q){cur.p.copy(q.p);cur.l.copy(q.l);cur.f=q.f;cam.position.copy(q.p);cam.lookAt(q.l);if(cam.fov!=q.f){cam.fov=q.f;cam.updateProjectionMatrix()}dirty=1}
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fly(ms){tw={a:{p:cur.p.clone(),l:cur.l.clone(),f:cur.f},b:pose(),t0:performance.now(),ms:still?1:ms}}
const upd=()=>{if(!tw)apply(pose())};
(function loop(t){
  if(tw){const u=Math.min(1,(t-tw.t0)/tw.ms),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    apply({p:tw.a.p.clone().lerp(tw.b.p,e),l:tw.a.l.clone().lerp(tw.b.l,e),f:tw.a.f+(tw.b.f-tw.a.f)*e});if(u>=1){tw=null;apply(pose())}}
  if(dirty){ren.render(scene,cam);dirty=0}requestAnimationFrame(loop);
})(0);
new ResizeObserver(()=>{const w=host.clientWidth,h=host.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();dirty=1}).observe(host);

/* seat view */
const mkSeat=(i,f)=>{const s=S[i],p=s.p,d=Math.hypot(p.x,p.z);return{i,e:new T.Vector3(p.x,p.y+1.35,p.z),yaw:s.yaw,pi:Math.atan2(-(p.y+1.35),d)*.8,f:f||72}};
function enter(i){se=mkSeat(i);mode='seat';bar();ui();fly(1300)}
function leave(){mode='orbit';bar();ui();fly(1100)}
function nbr(dr,dk){
  const s=S[se.i],b=s.b,r=s.r,k=s.k;
  if(dr){const r2=r+dr;if(r2<0||r2>=ROWS)return;const n2=12+r2,kk=Math.round((k+.5)/(12+r)*n2-.5);
    for(let o=0;o<n2;o++)for(const q of[kk+o,kk-o])if(q>=0&&q<n2&&!b.seats[r2][q])return idx(b,r2,q);return}
  for(let q=k+dk;q>=0&&q<12+r;q+=dk)if(!b.seats[r][q])return idx(b,r,q);
}
function go(dr,dk){const j=nbr(dr,dk);if(j==null){say('No available seat in that direction.');return}say('');se=mkSeat(j,se.f);ui();fly(700)}

/* overlay */
const say=m=>$('#msg').textContent=m;
const VIEWS={Overview:{th:3.93,el:.62,R:300},North:{th:Math.PI,el:.7,R:170},East:{th:4.712,el:.7,R:170},South:{th:0,el:.7,R:170},West:{th:1.571,el:.7,R:170}};
function bar(){
  $('#bar').innerHTML=mode=='orbit'?Object.keys(VIEWS).map(n=>`<button data-v="${n}">${n}</button>`).join('')
  :`<button data-a="back">Back to stadium</button><span class="sp"></span><button data-a="l">Seat left</button><button data-a="r">Seat right</button><button data-a="u">Row ahead</button><button data-a="d">Row behind</button><button class="add" data-a="add"></button>`;
}
function ui(){
  const h=$('#hud');
  if(mode=='orbit'){h.textContent='Drag to rotate, scroll to zoom. Click any seat to see the view from it.';return}
  const s=S[se.i],on=selSet.has(se.i);
  h.innerHTML=`<b>${s.b.code}</b><br>Row ${s.r+1}, seat ${s.k+1}, ${R(s.b.price)}<br>Drag to look around. Arrow keys move seat.`;
  const a=$('#bar .add');if(a)a.textContent=on?'Remove seat':'Add seat';
}
$('#bar').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.v){ob={...VIEWS[b.dataset.v]};fly(1100)}
  else{const a=b.dataset.a;if(a=='back')leave();else if(a=='add')toggle(se.i);else go(...{l:[0,-1],r:[0,1],u:[-1,0],d:[1,0]}[a])}
});

/* pointer: drag orbits or looks around, tap picks a seat, wheel or pinch zooms */
const ray=new T.Raycaster(),mv=new T.Vector2(),pp=new Map();let drag=0;
function hit(e){const r=el.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects([IC,TER])[0];return h&&h.object===IC?h.instanceId:-1}
const free=i=>i>=0&&!S[i].b.seats[S[i].r][S[i].k];
function hoverAt(e){
  hp=e;if(hq)return;hq=1;
  requestAnimationFrame(()=>{hq=0;if(mode!='orbit'||tw)return;const i=hit(hp),o=hov;hov=i;if(o!=i){if(o>=0)paint(o);if(i>=0)paint(i)}
    const tp=$('#tip');
    if(i>=0){const s=S[i],st=s.b.seats[s.r][s.k],r=host.getBoundingClientRect();tp.hidden=false;
      tp.innerHTML=`<b>${s.b.code}</b>, row ${s.r+1}, seat ${s.k+1}<br>${st==1?'Sold':st==2?'Held by another buyer':R(s.b.price)}`;
      tp.style.left=Math.min(hp.clientX-r.left+14,r.width-200)+'px';tp.style.top=(hp.clientY-r.top+14)+'px'}else tp.hidden=true;
    el.style.cursor=free(i)?'pointer':'';});
}
el.addEventListener('pointerleave',()=>{$('#tip').hidden=true;if(hov>=0){const o=hov;hov=-1;paint(o)}});
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pp.set(e.pointerId,{x:e.clientX,y:e.clientY});drag=0;$('#tip').hidden=true});
el.addEventListener('pointermove',e=>{
  const p=pp.get(e.pointerId);if(!p){if(mode=='orbit'&&!tw)hoverAt(e);return}
  if(pp.size==2){const o=[...pp.values()].find(v=>v!==p),d0=Math.hypot(p.x-o.x,p.y-o.y);p.x=e.clientX;p.y=e.clientY;const d1=Math.hypot(p.x-o.x,p.y-o.y)||1;drag=99;
    if(mode=='orbit')ob.R=clamp(ob.R*d0/d1,70,420);else se.f=clamp(se.f*d1/d0,40,90);upd();return}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;drag+=Math.abs(dx)+Math.abs(dy);if(tw)return;
  if(mode=='orbit'){ob.th-=dx*.006;ob.el=clamp(ob.el+dy*.004,.12,1.45)}else{se.yaw+=dx*.005;se.pi=clamp(se.pi+dy*.004,-1.2,.9)}
  upd();
});
const up=e=>{if(pp.has(e.pointerId)&&e.type=='pointerup'&&drag<6&&mode=='orbit'&&!tw&&pp.size==1){const i=hit(e);
  if(free(i))enter(i);else if(i>=0)say(S[i].b.seats[S[i].r][S[i].k]==1?'That seat is sold.':'Another buyer is holding that seat.');else say('')}
  pp.delete(e.pointerId)};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();if(tw)return;if(mode=='orbit')ob.R=clamp(ob.R*Math.exp(e.deltaY*.001),70,420);else se.f=clamp(se.f+e.deltaY*.03,40,90);upd()},{passive:false});
addEventListener('keydown',e=>{
  const k=e.key;
  if(mode=='seat'){
    if(k=='Escape')leave();
    else if(k=='Enter'&&e.target.tagName!='BUTTON')toggle(se.i);
    else{const m={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[k];if(m&&e.target.tagName!='BUTTON'){e.preventDefault();go(...m)}}
  }else if(e.target===el&&!tw){
    if(k=='ArrowLeft')ob.th+=.1;else if(k=='ArrowRight')ob.th-=.1;else if(k=='ArrowUp')ob.el=clamp(ob.el+.05,.12,1.45);else if(k=='ArrowDown')ob.el=clamp(ob.el-.05,.12,1.45);
    else if(k=='+'||k=='=')ob.R=clamp(ob.R*.9,70,420);else if(k=='-')ob.R=clamp(ob.R/.9,70,420);else return;
    e.preventDefault();upd();
  }
});

/* key: tier filter plus state swatches */
$('#key').innerHTML=`<span class="kl">Price per seat</span>`+[4500,2500,1800,1200].map(p=>`<button data-tier="${p}" aria-pressed="false"><i style="background:${hx(TC[p])}"></i>${R(p)}</button>`).join('')
 +[['Selected',0xff3b4a],['Held by another buyer',0xd19a2a],['Sold',0x39434a]].map(([t,x])=>`<span class="lg"><i style="background:${hx(x)}"></i>${t}</span>`).join('');
$('#key').addEventListener('click',e=>{const b=e.target.closest('[data-tier]');if(!b)return;tier=tier==+b.dataset.tier?null:+b.dataset.tier;
  document.querySelectorAll('#key [data-tier]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.tier==tier));for(let i=0;i<N;i++)paint(i)});

/* ticket */
const money=it=>{const sub=it.reduce((a,s)=>a+s.price,0),fee=Math.round(sub*.05),gst=Math.round(fee*.18);return{sub,fee,gst,tot:sub+fee+gst}};
const fl=(a,v)=>`<div class="fl"><span>${a}</span><span>${R(v)}</span></div>`;
const lines=(it,rm)=>it.map((s,i)=>`<div class="ln"><div>${s.b.code}<small>Row ${s.r+1}, seat ${s.k+1}</small></div><div class="rt">${R(s.price)}${rm?`<br><button class="rm" data-rm="${i}" aria-label="Remove ${s.b.code}, row ${s.r+1}, seat ${s.k+1}">Remove</button>`:''}</div></div>`).join('');
const barcode=ref=>{const g=rnd([...ref].reduce((a,x)=>a*31+x.charCodeAt(0)|0,7));let x=0,o='';for(let i=0;i<58;i++){const w=1+(g()*3|0);o+=`<rect x="${x}" y="0" width="${w}" height="44"/>`;x+=w+1+(g()*2|0)}return`<svg class="bc" viewBox="0 0 ${x} 44" preserveAspectRatio="none" aria-hidden="true">${o}</svg>`};
function drawBody(){
  const B=$('#body');
  if(done){const m=done.m;B.innerHTML=`<h3>Booking confirmed</h3><p class="note" style="margin:0 0 12px">Reference ${done.ref}. Tickets will be sent to your mobile number.</p>${lines(done.items)}<div class="perf"></div>${fl('Service fee',m.fee)}${fl('GST on service fee',m.gst)}<div class="tot"><span>Paid</span><b>${R(m.tot)}</b></div>${barcode(done.ref)}<button class="pay ghost" data-act="again">Book more seats</button>`;return}
  if(!sel.length){B.innerHTML=`<h3>Your seats</h3><p class="note" style="margin:0">No seats selected. Click a seat in the stadium to sit in it, then choose Add seat. You can hold up to ${MAXS}, for ten minutes once you pick the first.</p>`;return}
  const m=money(sel);
  B.innerHTML=`<h3>Your seats</h3>${lines(sel,1)}<div class="perf"></div>${fl(`Tickets (${sel.length})`,m.sub)}${fl('Service fee, 5%',m.fee)}${fl('GST on service fee, 18%',m.gst)}<div class="tot"><span>Total</span><b>${R(m.tot)}</b></div><button class="pay" data-act="pay">Pay ${R(m.tot)}</button><p class="note">Seats are held for <b id="hold"></b>. Demonstration only, no payment is taken.</p>`;
  tick();
}
const startHold=()=>{hold=Date.now()+6e5;timer=setInterval(tick,1000)};
const stopHold=()=>{clearInterval(timer);hold=0};
function tick(){
  const l=hold-Date.now(),h=$('#hold');
  if(hold&&l<=0){const o=new Set(selSet);stopHold();sel=[];repaint(o);say('Your ten minute hold ended and the seats were released.');drawBody();ui();return}
  if(h&&hold)h.textContent=Math.floor(l/6e4)+':'+String(Math.floor(l/1e3)%60).padStart(2,'0');
}
function toggle(i){
  const s=S[i];if(s.b.seats[s.r][s.k])return;
  const o=new Set(selSet),j=sel.findIndex(x=>x.i==i);if(done)done=null;say('');
  if(j>=0)sel.splice(j,1);
  else{if(sel.length>=MAXS){say(`You can hold up to ${MAXS} seats at once.`);return}if(!sel.length)startHold();sel.push({i,b:s.b,r:s.r,k:s.k,price:s.b.price})}
  repaint(o);if(!sel.length)stopHold();drawBody();ui();
}
$('#body').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.rm!=null){const o=new Set(selSet);sel.splice(+t.dataset.rm,1);repaint(o);if(!sel.length)stopHold();say('');drawBody();ui()}
  else if(t.dataset.act=='pay'){const o=new Set(selSet),items=[...sel];items.forEach(s=>s.b.seats[s.r][s.k]=1);
    done={ref:'TE-'+Math.random().toString(36).slice(2,8).toUpperCase(),items,m:money(items)};sel=[];stopHold();say('');repaint(o);drawBody();ui()}
  else if(t.dataset.act=='again'){done=null;drawBody()}
});

apply(pose());bar();ui();drawBody();
})();
</script>
</body></html>
